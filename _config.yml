# Site settings
title: "Arman Mazloumzadeh Resume"
description: "Senior Software Engineer | Backend Engineer | Python Developer | Django | APIs | DevOps"

plugins:
  - jekyll-seo-tag

defaults:
  - space:
      path: ""
    values:
      image: /images/resume-preview.jpg # used for og:image tags

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar: "true"
resume_name: "Arman Mazloumzadeh"
resume_title: "Senior Software Engineer"

# used for the contact button in _layouts/resume.html
resume_contact_email: "armanexplorer@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone: "+98 910-510-7835"
resume_contact_address: "Tehran, Iran"

resume_header_contact_info: |
  armanexplorer@gmail.com • linkedin.com/in/armanexplorer • github.com/armanexplorer<br/>
display_header_contact_info: "true"
resume_header_intro: |
  <p>
    Senior Python Backend Engineer with 6+ years of experience architecting scalable, production-ready APIs and AI-assisted workflows. Expert in microservices, async processing, and cloud-native deployments across AWS and GCP. Proven track record owning features end-to-end--from design to rollout--using tools like Claude Code and Cursor to accelerate delivery without compromising quality.
  </p>

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work: "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience: true
resume_section_education: true
# resume_section_projects: true
resume_section_skills: true
resume_section_links: false
resume_section_opensources: true
resume_section_volunteering: true
resume_section_interests: true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url: "https://github.com/armanexplorer"
  # resume_twitter_url:           "http://twitter.com/jglovier"
  # resume_dribbble_url:          "https://dribbble.com/jag"
  # resume_facebook_url:          "insert Facebook URL here"
  resume_linkedin_url: "https://www.linkedin.com/in/armanexplorer"
  # resume_instagram_url:         "insert your Instagram URL here"
  # resume_website_url:           "https://armanexplorer.com"
  resume_pdf_url: "Arman-Mazloumzadeh-Resume.pdf"
  # resume_medium_url:            "https://medium.com/@jglovier"
resume_print_social_links: true

# Design settings
resume_theme: default
